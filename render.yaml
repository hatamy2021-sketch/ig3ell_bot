services:
  - type: web
    name: ig3ell-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app
    envVars:
      - key: BOT_TOKEN
        sync: false   # بعداً در داشبورد وارد می‌کنیم
      - key: ADMIN_ID
        value: 6204956765
      - key: WEBHOOK_URL
        sync: false   # بعداً وارد می‌کنیم
